[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fineweb-edu-2013-qwen2"
version = "0.1.0"
description = "Reproducible Qwen2-7B token counts for FineWeb-Edu 2013"
requires-python = ">=3.10,<3.14"
dependencies = [
  # Transformers 5.0.0 requires huggingface-hub>=1.3, which in turn rules out
  # datasets 2.x. datasets 4.0.0 is the newest release that still accepts
  # pyarrow 17, so the Parquet writer stays on the version used for the
  # approved sample.
  "datasets==4.0.0",
  "huggingface-hub==1.30.0",
  # numpy 2.x publishes only manylinux_2_28 wheels; this host is glibc 2.26.
  "numpy==1.26.4",
  "pyarrow==17.0.0",
  "tokenizers==0.22.2",
  "transformers==5.0.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.2"]

[project.scripts]
process-fineweb-2013 = "process_fineweb_2013:main"

[tool.setuptools]
py-modules = ["process_fineweb_2013"]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]
